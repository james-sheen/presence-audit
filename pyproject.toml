[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presence-audit"
# Read from the package rather than duplicated here: a version written twice is
# a version that will disagree with itself.
dynamic = ["version"]
description = "Given a declaration and a capture, say which declared points are reading, present but not reading, or absent."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "James Sheen"}]
keywords = ["audit", "presence", "declaration", "attestation", "regression"]
# NONE, and deliberately. Nothing here imports a third-party package at module
# scope; a vertical supplies the domain and a judge is optional. Adding a
# dependency to this list is a claim that the presence question cannot be
# answered without it.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/james-sheen/presence-audit"
Source = "https://github.com/james-sheen/presence-audit"
Issues = "https://github.com/james-sheen/presence-audit/issues"

[tool.hatch.version]
path = "src/presence_audit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/presence_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# THE TREE, NOT WHATEVER IS INSTALLED. CI installs this package with `-e .`, so
# it has always run the suite against the source; a developer with a released
# wheel on the path had not, and nothing said so. Measured on 0.1.10: a bare
# `pytest` in this checkout imported the 0.1.9 wheel from site-packages, ran 403
# tests and reported them green -- none of them about the tree they sit in.
#
# The shipped bridge is still resolved normally, so the one test that adapts a
# really published implementation keeps adapting a really published one.
pythonpath = ["src"]
