# The suite, and the two things it cannot check about itself.
#
# This repository had no CI at all until 0.1.2. Its suite ran only where someone
# remembered to run it, and what that cost is on the record: the 0.1.0 wheel
# shipped a NOTICE belonging to another distribution, and the suite could not be
# COLLECTED from a clean clone because one test imported a package this
# distribution does not depend on. Both were found by hand, months apart.
#
# So two things here are deliberate. The clean-clone job installs NOTHING but
# this package, because that is the environment a contributor actually has. And
# the full job installs the bridge and then fails on any skip -- a test that
# quietly stopped running is the failure this repository already paid for.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every interpreter `requires-python` admits, not just the one this workflow
  # happened to name. `>=3.10` is a claim about five of them.
  versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Nothing but this package, which is what a clone has
        # No bridge, no extras. This is the environment the suite was
        # uncollectable in, and the job that would have said so.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -e . pytest
          python3 -m pip list --format=freeze | sed 's/^/    /'
      - name: The suite, from a clean clone
        run: python3 -m pytest tests/ -q -rs

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit-message and authorship steps need the
          # commits in this push, and the default depth of 1 would leave them
          # reading only the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, with the shipped bridge beside it
        # `--no-deps` on the bridge deliberately. It depends on THIS package, so
        # resolving its dependencies would fetch the released core from the index
        # and test that instead of the tree this workflow is checking.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -e . pytest
          python3 -m pip install --quiet --no-deps bmc-sensor-audit
          python3 -c "import presence_audit; print('  core under test:', presence_audit.__file__)"

      - name: The suite, with nothing skipped
        # A skip here means the bridge did not arrive and the only test that
        # adapts a really published implementation went unrun. That test is the
        # one claim no fixture in this repository can make, and its absence is
        # invisible in a green run.
        run: |
          set -euo pipefail
          python3 -m pytest tests/ -q -rs | tee /tmp/suite.txt
          if grep -qE '[0-9]+ skipped' /tmp/suite.txt; then
            echo "::error::a test was skipped; see the reasons above"
            exit 1
          fi

      - name: It still names no domain, from the built artifact
        # The suite reads the source tree. This reads what a user would get,
        # because the defect this checks for -- prose belonging to another
        # distribution -- shipped inside a wheel while every source-level test
        # passed.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet build
          python3 -m build --wheel --outdir /tmp/dist . >/dev/null
          python3 - <<'PY'
          import glob, zipfile
          w = glob.glob("/tmp/dist/*.whl")[0]
          z = zipfile.ZipFile(w)
          notice = z.read([n for n in z.namelist() if n.endswith("NOTICE")][0]).decode()
          first = next(l.strip() for l in notice.splitlines() if l.strip())
          assert first == "presence-audit", f"the wheel NOTICE opens with {first!r}"
          print("  wheel NOTICE names this distribution")
          PY

      - name: Every vertical the README names is where its row says
        # The one claim here that no assertion from a tree can reach. The Known
        # verticals section points a reader OUT of this distribution, and
        # whether a name in it was ever published is a fact about the index.
        # The suite checks the group, the variable and the registration; this
        # checks existence -- and absence, for a row that claims it -- in the
        # only job that has a network.
        #
        # Kept out of `tests/` deliberately. A network test would skip on a
        # clean clone, and the step above turns a skip into a failure -- so it
        # would either red this repository on somebody else's outage or teach
        # the suite to tolerate skips, and the second is the expensive one.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.metadata as md
          import pathlib, re, urllib.error, urllib.request

          README = pathlib.Path("README.md").read_text(encoding="utf-8")
          section = re.search(r"^## Known verticals\n(.*?)(?=^## |\Z)",
                              README, re.S | re.M)
          assert section, "the README has no Known verticals section"
          linked = re.findall(r"\[`([a-z0-9]+(?:-[a-z0-9]+)+)`\]\((https://[^)\s]+)\)",
                              section.group(1))
          assert linked, "the Known verticals section names no distribution"
          named = [name for name, _ in linked]

          # BOTH HOSTS ARE CLAIMS, and both are asked. A row linked to the index
          # says the name resolves there; a row linked to a repository says it
          # does not. This asked only the first, and the second is where the
          # table went wrong: `factory-line-audit` was linked to its repository
          # on 2026-09-09 as not yet uploaded, was uploaded that evening, and
          # four published pages of this package went on saying otherwise.
          on_the_index = [name for name, url in linked if "pypi.org" in url]
          off_the_index = [name for name, url in linked if "pypi.org" not in url]
          assert on_the_index, (
              "no row claims the index, so the resolution check below would "
              "pass over nothing")

          # NON-VACUITY, asserted where it can be. The suite's registration
          # check iterates whatever verticals this environment has installed,
          # and a clean clone has none -- so it passes over an empty set there
          # by design. This is the job that installs one, so this is where the
          # set can be required to be non-empty. If the bridge ever stops being
          # a name in that section, the check goes quietly vacuous everywhere.
          installed = []
          for name in named:
              try:
                  md.distribution(name)
              except md.PackageNotFoundError:
                  continue
              installed.append(name)
          assert installed, (
              "this job installs no vertical the README names, so the suite's "
              "registration check read nothing and its silence means nothing")
          print("  registration was checked against:", ", ".join(installed))

          # The same question for the other check that reads what is installed.
          # `test_it_names_no_domain` refuses any word an installed vertical
          # declares as its own noun, and derives that set from the verticals
          # rather than from a list -- so with none installed it quantifies over
          # nothing and passes. This is the job that installs one.
          from presence_audit import plugins, vocabulary
          nouns = set()
          for entry in plugins._entry_points():
              try:
                  entry.load()()
              except Exception:
                  continue
              supplied = vocabulary.noun()
              if supplied != vocabulary.DEFAULT_NOUN:
                  nouns |= set(supplied)
              vocabulary.reset()
          assert nouns, (
              "no installed vertical declares a noun, so the domain-prose check "
              "in the suite ran over an empty word set and proved nothing")
          print("  domain prose was checked against:", ", ".join(sorted(nouns)))

          def answers(name):
              slug = re.sub(r"[-_.]+", "-", name).lower()
              url = f"https://pypi.org/simple/{slug}/"
              try:
                  with urllib.request.urlopen(url, timeout=30) as answer:
                      return url, answer.status
              except urllib.error.HTTPError as refused:
                  return url, refused.code

          for name in on_the_index:
              url, code = answers(name)
              assert code == 200, (
                  f"the README sends a reader to {name}, and {url} answers "
                  f"{code}. Either it was never published or it was removed")
              print(f"  {name} resolves on the index")

          # The other direction, and only a 404 answers it: a network failure
          # raises out of `answers` rather than reading as absence, and any
          # other code is neither a yes nor a no.
          for name in off_the_index:
              url, code = answers(name)
              assert code == 404, (
                  f"the README says {name} is not on the index, and {url} "
                  f"answers {code}. If it is published now, link the row to "
                  f"the index and say how to install it")
              print(f"  {name} is not on the index, as its row says")
          if not off_the_index:
              print("  no row says it is off the index")
          PY

      - name: Hygiene sweep
        # The same check the hook runs, over the whole tree rather than the
        # staged diff. This is the backstop for every commit made from a clone
        # where the hook was never enabled -- `core.hooksPath` is per-clone, so
        # that is every fresh clone until somebody remembers.
        run: python3 tools/hygiene_check.py --all

      - name: Commit messages
        # The commit-msg hook's backstop, and the reason this is not optional: a
        # message is the one published surface no later commit can correct.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref; checking HEAD only"
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
            echo "checking $(echo "$LIST" | grep -c . ) commit message(s) in $BASE..${{ github.sha }}"
          fi
          FAILED=0
          for SHA in $LIST; do
            git log -1 --format=%B "$SHA" > /tmp/msg.txt
            echo "--- $SHA"
            python3 tools/commit_msg_check.py /tmp/msg.txt || FAILED=1
          done
          exit $FAILED

      - name: Authorship
        # A commit's author is neither its message nor a file in it, so neither
        # check above can see it. A local `user.email` quietly beat the global
        # one and a personal address reached 24 published commits. The hook
        # checks the setting before the commit; this checks the RESULT after it,
        # which is the thing that actually gets published.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
          fi
          FAILED=0
          for SHA in $LIST; do
            for WHO in $(git log -1 --format='%ae%n%ce' "$SHA"); do
              case "$WHO" in
                *@users.noreply.github.com|*@noreply.github.com) ;;
                *) echo "::error::$SHA carries a real address in its authorship"; FAILED=1 ;;
              esac
            done
          done
          exit $FAILED

      - name: The same suite, from the sdist this tree builds
        # THE ARTIFACT, NOT THE CHECKOUT. A packager or a reviewer runs the suite
        # from the sdist, and on 2026-09-26 five of the nine sdists in this family
        # could not: each carried tests/ without files those tests import or open,
        # so collection stopped and nothing ran, while twine, the metadata and a
        # clean wheel install all passed over it. So the suite runs again from the
        # unpacked sdist and from `git archive HEAD`, neither with a `.git`, and
        # every test must answer the same on both sides: a test that needs a
        # repository skips on both, and a file the sdist leaves out cannot hide.
        # The package is reinstalled from the sdist first, so what imports is
        # what a wheel built from the artifact would install.
        env:
          REINSTALL: "yes"
          PRE: ""
        run: |
          set -euo pipefail
          T="${RUNNER_TEMP:-/tmp}/sdist-check"
          rm -rf "${T}" && mkdir -p "${T}/tree" "${T}/unpacked"
          git archive HEAD | tar -x -C "${T}/tree"
          python3 -m pip install --quiet build
          python3 -m build --sdist --outdir "${T}/dist" . > "${T}/build.log"
          tar -xzf "${T}"/dist/*.tar.gz -C "${T}/unpacked" --strip-components=1
          test ! -e "${T}/unpacked/.git"
          if [ "${REINSTALL}" = yes ]; then
            (cd "${T}/unpacked" && python3 -m pip install --quiet --no-deps --force-reinstall .)
          fi
          for side in tree unpacked; do
            (cd "${T}/${side}" && { [ -z "${PRE}" ] || python3 ${PRE} > /dev/null; } \
               && python3 -m pytest tests/ -q -p no:cacheprovider --junitxml="${T}/${side}.xml") \
               > "${T}/${side}.log" 2>&1 || true
          done
          python3 - "${T}" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          T = pathlib.Path(sys.argv[1])
          def outcomes(side):
              report = T / f"{side}.xml"
              if not report.is_file():
                  print((T / f"{side}.log").read_text()[-3000:])
                  sys.exit(f"::error::the {side} run wrote no report")
              out = {}
              for case in ET.parse(report).getroot().iter("testcase"):
                  kinds = {child.tag for child in case}
                  out[f"{case.get('classname')}::{case.get('name')}"] = (
                      "failed" if "failure" in kinds else "error" if "error" in kinds
                      else "skipped" if "skipped" in kinds else "passed")
              return out
          tree, sdist = outcomes("tree"), outcomes("unpacked")
          if not tree:
              sys.exit("::error::the tracked tree collected nothing, so there is nothing to compare")
          broken = sorted(k for k, v in sdist.items() if v in ("failed", "error"))
          missing = sorted(set(tree) - set(sdist))
          extra = sorted(set(sdist) - set(tree))
          changed = sorted(k for k in set(tree) & set(sdist) if tree[k] != sdist[k])
          for label, keys in (("fails when run from the sdist", broken),
                              ("is in the tree and not in the sdist", missing),
                              ("is in the sdist and not in the tree", extra),
                              ("answers differently from the sdist", changed)):
              for key in keys[:25]:
                  print(f"::error::{key} {label} (tree: {tree.get(key)}, sdist: {sdist.get(key)})")
          if broken or missing or extra or changed:
              print((T / "unpacked.log").read_text()[-3000:])
              sys.exit(1)
          count = lambda outcome: sum(1 for v in sdist.values() if v == outcome)
          print(f"  the sdist answers exactly as the tracked tree does: {len(sdist)} tests, "
                f"{count('passed')} passed, {count('skipped')} skipped")
          PY
